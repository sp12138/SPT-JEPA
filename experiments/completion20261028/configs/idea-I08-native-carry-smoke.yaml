  run_backward: true
  seed: 0
  deterministic: false
  precision: bf16
  autocast: true
  gradient_clip_val: 1.0
  gradient_accumulation_steps: 1
  gradient_norm_dtype: float32
  log_every_n_steps: 20
  log_timing: true
  output_dir: /efs/prescottsun/SPT-JEPA/runs/completion_20261028/idea-I08-native-carry-smoke
