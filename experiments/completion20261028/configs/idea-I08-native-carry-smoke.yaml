    reduce_dtype: float32
    output_dtype: null
    buffer_dtype: null
    cast_forward_inputs: true
    preserve_module_paths: []
    preserve_forward_input_paths: []
    contract_mode: append
  engine: fsdp2
  mcore_ddp:
    overlap_grad_reduce: true
    overlap_param_gather: true
attention:
