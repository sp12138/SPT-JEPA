  dirpath: ''
  state: full
  format: dcp
  save_final: true
  keep_last: 2
  async_save: false
  save_optimizer: true
  save_trainer_state: true
  empty_cache_before_save: true
resume:
  path: none
  weights: true
  optimizer: true
  training_state: true
  strict: true
  stage_remote: false
storage:
  s3_mounts: []
