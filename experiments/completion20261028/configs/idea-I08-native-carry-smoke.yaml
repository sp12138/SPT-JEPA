model:
  name: as_jepa_spt
  init_device: meta
  weight_loading: auto
  pretrained_path: ''
  extras:
    data_root: /efs/prescottsun/SPT-JEPA/data/pusht
    campaign_output: /efs/prescottsun/SPT-JEPA/runs/completion_20261028/idea-I08-native-carry-smoke
    as_jepa:
      kind: S1Carry
      width: 192
      renderer_depth: 6
      window: 10
      latent_weight: 0.1
      use_semantic_feedback: true
      freeze_frame_encoder: true
    export_every: 100
    warm_start_checkpoint: /efs/prescottsun/SPT-JEPA/runs/insights12h_20261027/late-probes-native-dev2/checkpoints/S1-native-seed0
training:
  recipe: model
  models: {}
  dmd: {}
  cd: {}
latent_cache:
  mode: online
data:
  train_manifest: /efs/prescottsun/SPT-JEPA/data/pusht/dataset_card.json
  val_manifest: ''
  sources: []
  mix_seed: 20260726
  steps_per_epoch: 1000000000
  base_seed: 1234567
  sampler_seed: 0
  batch_size: 128
  num_workers: 4
  shuffle: true
  drop_last: true
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
optimizer:
  name: adamw
  learning_rate: 0.0001
  weight_decay: 0.0
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
optimizers: {}
scheduler:
  name: constant_with_warmup
