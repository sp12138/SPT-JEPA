model:
  name: rep_world
  init_device: meta
  weight_loading: auto
  pretrained_path: ''
  extras:
    initial_weights_format: native
    codec:
      family: pixel
      variant: rgb16
    states: 10
    frame_interval: 1
    random_clip: false
    use_muon: true
    world:
      width: 768
      depth: 8
      heads: 12
      patch_size: 1
      mlp_ratio: 5.316536458333333
      qk_norm: true
      adaln_mode: adaln_lora
      adaln_lora_dim: 256
      condition_dropout: 0.1
      cross_attention_every: 4
      condition_mode: cross_attention
      cross_attention_position: before_self
      cross_attention_scope: global
      cross_attention_3d_rope: true
      pixel_depth: 2
      pixel_width: 16
    conditioner:
      input: rgb
      input_size: 256
      temporal_patch: 4
      spatial_patch: 16
      width: 1024
      depth: 21
      heads: 16
      feature_layers:
      - 20
      mlp_ratio: 4.192
      pretrained_grid: 16
      context_mask_ratio: 0.9
      architecture: split_ec
      encoder_depth: 3
      mask_stage: before_e
    flow:
      mode: no_zprev
      mean: 0.8
      std: 0.8
      shift: -1.0
      base_shift: 2.667
      distant_target_prob: 0.5
      target_layout: single_state
      target_origin_reserve: 2
      future_target_choices: 2
    rollout:
      total_states: 9
      history_states: 1
      history_window_states: 8
      cfg_interval_min: 0.2
      cfg_interval_max: 1.0
      fps: 16
    ema:
      enabled: true
      decay: 0.99
      evaluation_weights: online
    repa:
      enabled: false
      weight: 0.0
      align_layer: 2
      teacher_checkpoint: /efs/stormyxie/model_zoo/vjepa2-1-vitb16-384/vjepa2_1_vitb_dist_vitG_384.pt
      teacher_width: 768
