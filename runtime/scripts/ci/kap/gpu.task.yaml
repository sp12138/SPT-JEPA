  WAN_CD_CI_ROOT: /efs/weilunfeng/vforge/examples/taichu-cd
  WAN_EFS_ROOT: /gwm-efs
  WAN_CODE_ROOT: /gwm-code
startCmd: cd /data/work/vforge && python scripts/ci/worker.py gpu
