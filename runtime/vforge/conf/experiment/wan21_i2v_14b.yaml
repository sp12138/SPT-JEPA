# @package _global_
# Single Wan 2.1 I2V 14B experiment file reused by train/prepare/eval/convert.

model:
  name: wan21
  init_device: meta
  weight_loading: auto
  pretrained_path: ""

latent_cache:
  mode: offline

evaluation:
  num_inference_steps: 50
  guidance_scale: 5.0
  negative_prompt: null

data:
  train_manifest: ""
  val_manifest: ""
  cache_dir: ""
  base_seed: 1234567
  sampler_seed: 0
  batch_size: 1
  num_workers: 0
  shuffle: true
  drop_last: true
  pin_memory: true
  persistent_workers: false
  prefetch_factor: null

optimizer:
  name: adamw
  learning_rate: 1.0e-5
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  name: none
  factor: 1.0
  warmup_steps: 0

logging:
  jsonl: true
  jsonl_filename: train_steps.jsonl
  wandb_enabled: true
  wandb_project: ${oc.env:WANDB_PROJECT,vforge}
  wandb_entity: null
  wandb_group: null
  wandb_name: ""
  wandb_tags: []
  wandb_mode: null
  wandb_save_dir: ""
  wandb_include_optimizer_in_backward: false
  wandb_exclude_dataloader_from_step: false

runtime:
  max_steps: 0
  run_backward: true
  seed: 42
  precision: bf16
  autocast: false
  gradient_clip_val: 0.0
  log_every_n_steps: 1
  log_timing: true
  output_dir: outputs/wan21_i2v_14b

limitations:
  expert_parallel: false
  ring_attention: false
  train_condition_encoders: false
  cross_attention_ulysses: false
  padded_cross_attention_requires_varlen: true

parallel:
  usp_size: 1
  cp_size: 1
  dp_size: auto
  dp_replicate_size: 1
  dp_shard_size: 1
  dp_mode: fsdp2
  include_usp_in_fsdp: true
  gradient_checkpointing: true
  reshard_after_forward: true

attention:
  backend: auto
  allow_fallback: true
  debug: false

attention_offload:
  enable: false

convert_checkpoint:
  input_path: ""
  output_path: ""
  dry_run: false
