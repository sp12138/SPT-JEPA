# @package _global_
# Wan 2.2 TI2V 5B Self-Forcing DMD.
#
# This is the native VForge DMD contract. It starts directly from an existing
# causal generator and bidirectional score checkpoints; prepare-ODE and ODE-init
# are intentionally outside this experiment.

training:
  recipe: dmd
  models:
    generator:
      model: wan_taichu
      config:
        variant: wan22_ti2v_5b_causal_teacher
        condition_streams: [normal]
        max_frames: 121
        max_sequence_length: 512
        frame_per_block: 3
        first_frame_own_block: true
      pretrained_path: /gwm-efs/shared/models/Wan2.2-TI2V-5B-Diffusers
      # Flat, model-native state dict; no top-level generator/critic section.
      init_weights: /path/to/wan22-ti2v-5b-causal-generator.pt
    real_score:
      model: wan_taichu
      config:
        variant: wan22_ti2v_5b
      pretrained_path: /gwm-efs/shared/models/Wan2.2-TI2V-5B-Diffusers
      init_weights: /path/to/wan22-ti2v-5b-real-score.pt
    fake_score:
      model: wan_taichu
      config:
        variant: wan22_ti2v_5b
      pretrained_path: /gwm-efs/shared/models/Wan2.2-TI2V-5B-Diffusers
      # This may point to the same initial file as real_score.
      init_weights: /path/to/wan22-ti2v-5b-fake-score.pt
  dmd:
    algorithm: distribution_matching
    rollout:
      # Trajectory boundaries. Terminal zero is a clean boundary, not a fifth
      # transformer call: effective forwards are 1000, 938, 833, and 625.
      denoising_steps: [1000, 938, 833, 625, 0]
      terminal_zero_is_boundary: true
      last_step_only: true
      context_noise: 0
    score:
      num_train_timesteps: 1000
      timestep_shift: 5.0
      sampled_timestep_min: 1
      # Taichu samples 1..1000, applies shift=5, then clamps effective score
      # calls to the middle 2%..98% interval.
      effective_timestep_clamp: [20, 980]
      real_guidance_scale: 5.0
      fake_guidance_scale: 0.0
      denoising_loss: flow
      mse_weight: 0.0
    schedule:
      # Generator updates at global steps 0, 5, 10, ...; critic updates every
      # global step after the optional generator update.
      generator_every_n_steps: 5
    ema:
      enabled: true
      decay: 0.99
      start_step: 200
      storage: sharded_fp32

latent_cache:
  # DMD consumes the ordinary Wan Taichu CT cache. Set mode=online and replace
  # the encoded source below with a typed raw source to encode during training.
  mode: offline

data:
  # No DMD-specific prepare step or cache schema is required.
  sources:
    - name: seedance_self_forcing
      cache_dir: /path/to/wan-taichu-ct-cache
  base_seed: 1234567
  sampler_seed: 0
  batch_size: 1
  num_workers: 0
  shuffle: true
  drop_last: true
  pin_memory: true
  persistent_workers: false
  prefetch_factor: null

optimizers:
  generator:
    name: adamw
    learning_rate: 2.0e-6
    weight_decay: 0.01
    betas: [0.0, 0.999]
    eps: 1.0e-8
  critic:
    name: adamw
    learning_rate: 4.0e-7
    weight_decay: 0.01
    betas: [0.0, 0.999]
    eps: 1.0e-8

# The Taichu DMD module does not return or step the scheduler declared by its
# outer experiment. Fixed LR is therefore the effective parity behavior.
scheduler:
  name: none
  factor: 1.0
  warmup_steps: 0

logging:
  jsonl: true
  jsonl_filename: train_steps.jsonl
  wandb_enabled: false
  wandb_project: ""
  wandb_entity: null
  wandb_group: null
  wandb_name: ""
  wandb_tags: []
  wandb_mode: null
  wandb_save_dir: ""
  wandb_include_optimizer_in_backward: false
  wandb_exclude_dataloader_from_step: false

runtime:
  max_steps: 0
  run_backward: true
  seed: 42
  precision: bf16
  autocast: true
  gradient_clip_val: 0.0
  log_every_n_steps: 1
  log_timing: true
  output_dir: outputs/wan22_ti2v_5b_dmd
  weights_strict: true

limitations:
  expert_parallel: false
  ring_attention: false
  train_condition_encoders: false
  cross_attention_ulysses: false
  padded_cross_attention_requires_varlen: true

parallel:
  # DMD's KV-cached causal rollout currently rejects Ulysses.
  usp_size: 1
  dp_size: auto
  dp_replicate_size: 1
  dp_shard_size: 1
  dp_mode: fsdp2
  include_usp_in_fsdp: true
  gradient_checkpointing: true
  reshard_after_forward: true

attention:
  backend: auto
  allow_fallback: true
  debug: false

attention_offload:
  enable: false

checkpoint:
  enabled: true
  every_n_steps: 50
  dirpath: ""
  state: full
  format: dcp
  save_final: true
  keep_last: 2
  async_save: true
  save_optimizer: true
  save_trainer_state: true
  empty_cache_before_save: false

resume:
  path: none
  weights: true
  optimizer: true
  training_state: true
  stage_remote: false
